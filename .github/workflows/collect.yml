# Vercel's free plan only allows a cron job once per day, so the 15-minute
# collection schedule lives here instead.
#
# Repo → Settings → Secrets and variables → Actions → add:
#   APP_URL          https://your-app.vercel.app
#   COLLECT_SECRET   the same value as in Vercel's environment variables
name: Collect YouTube snapshots

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collection for all regions
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.COLLECT_SECRET }}" \
            "${{ secrets.APP_URL }}/api/collect")
          cat /tmp/out.json
          echo
          if [ "$code" -ge 400 ]; then
            echo "Collection failed with HTTP $code"
            exit 1
          fi
