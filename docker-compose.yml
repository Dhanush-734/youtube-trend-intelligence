services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-trend-intelligence
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - COLLECT_SECRET=${COLLECT_SECRET}
      - APP_URL=${APP_URL:-http://localhost:3000}
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
